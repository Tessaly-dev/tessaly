# SPDX-License-Identifier: Apache-2.0
# GoReleaser builds the release binaries. The release workflow runs it when a
# version tag is pushed. Try it locally with "make snapshot".
version: 2

project_name: tess

before:
  hooks:
    # The UI is embedded into the binary, so it must be built first.
    - make ui
    # Stop if the UI build left no index.html, so no release ships without a UI.
    - sh -c 'test -f web/dist/index.html'

builds:
  - id: tess
    main: ./cmd/tess
    binary: tess
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tessaly-dev/tessaly/internal/version.Version=v{{ .Version }}
    # Use the commit time, so the same commit always builds the same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One multi-arch image on GHCR. The release workflow signs it and attests its
# provenance after GoReleaser pushes it.
dockers_v2:
  - images:
      - ghcr.io/tessaly-dev/tessaly
    tags:
      - "v{{ .Version }}"
      # Pre-releases never move "latest".
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # An SBOM attestation from buildkit, pushed next to the image.
    sbom: true
    labels:
      org.opencontainers.image.title: tess
      org.opencontainers.image.source: https://github.com/Tessaly-dev/tessaly
      org.opencontainers.image.version: "v{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

# One SPDX SBOM per archive, made by syft.
sboms:
  - artifacts: archive

# Keyless cosign signature of the checksums file. It covers every archive,
# because each archive's SHA-256 is in the file.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# The Homebrew cask in Tessaly-dev/homebrew-tap: brew install tessaly-dev/tap/tess
# The release workflow passes HOMEBREW_TAP_TOKEN, a token that can only write
# to the tap. Without it, and for pre-releases, the tap is left alone.
homebrew_casks:
  - name: tess
    binaries: [tess]
    description: Run coding agents in parallel git worktrees, from your browser
    homepage: https://github.com/Tessaly-dev/tessaly
    license: Apache-2.0
    repository:
      owner: Tessaly-dev
      name: homebrew-tap
      token: "{{ envOrDefault \"HOMEBREW_TAP_TOKEN\" \"\" }}"
    commit_author:
      name: tessaly-release
      email: hello@tessaly.dev
    commit_msg_template: "tess {{ .Tag }}"
    skip_upload: "{{ if envOrDefault \"HOMEBREW_TAP_TOKEN\" \"\" }}auto{{ else }}true{{ end }}"
    hooks:
      post:
        # The binaries are not notarized by Apple. Homebrew has already checked
        # the archive's SHA-256, so clear the quarantine flag that would block it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tess"]
          end

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  # Tags such as v0.1.0-rc.1 publish as a pre-release.
  prerelease: auto
  # The workflow publishes a draft. A maintainer checks it and publishes it.
  draft: true
