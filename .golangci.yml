version: "2"

linters:
  # Defaults (errcheck, govet, ineffassign, staticcheck, unused) plus security
  # and error-handling checks.
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests make files with loose modes, read temp files, send bare cookies
      # and run git on temp folders on purpose, to check that the code copes.
      - path: _test\.go
        linters: [gosec]
        text: "G124|G204|G302|G304"

formatters:
  enable:
    - gofmt
    - goimports
