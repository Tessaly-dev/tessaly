# SPDX-License-Identifier: Apache-2.0
name: CI

# Run only when code, build config or this workflow changes. Docs-only
# changes (Markdown, docs/, templates) skip CI to save runner minutes.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .golangci.yml
      - Makefile
      - .goreleaser.yaml
      - "scripts/**"
      - "web/**"
      - "!web/**/*.md"
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .golangci.yml
      - Makefile
      - .goreleaser.yaml
      - "scripts/**"
      - "web/**"
      - "!web/**/*.md"
      - .github/workflows/ci.yml
      - .github/workflows/release.yml

# Least privilege: every job only reads the repo. Jobs that need more must ask
# for it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  GORELEASER_VERSION: v2.20.3

jobs:
  lint:
    name: Lint and UI tests
    # Draft PRs skip CI. Marking the PR ready for review starts it.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: UI type check and tests
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test

  test:
    name: Go tests (${{ matrix.name }})
    if: github.event_name == 'push' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
      # The UI is platform independent, so its tests run once in the lint job.
      - name: Go tests
        run: go test -race ./...
      - name: Install script tests
        run: sh scripts/install_test.sh

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install Chromium for the E2E tests
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      # The E2E tests drive the real binary built for this runner.
      - name: E2E tests
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o bin/tess ./cmd/tess
          cd web && pnpm run e2e
      # A snapshot runs the release config end to end for every target,
      # without signing or publishing, so a broken config fails here first.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign,sbom
